<!DOCTYPE html>
<html lang="en" data-bs-theme="dark"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document · Roosta</title>
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="stylesheet" href="/static/vendor/tabler/tabler.min.css">
<link rel="stylesheet" href="/static/shell.css">
<script src="/static/theme.js"></script>
<script src="/static/document-editor.js"></script>
<script src="/static/nav-count.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/vault-markdown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js"></script>
<script src="/static/markdown-copy.js"></script>
<style>
  .document-shell{max-width:1100px;margin:0 auto;padding:1.75rem var(--shell-gutter) 4rem}
  .document-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.375rem;margin-bottom:1.25rem}
  .back{color:var(--console-tertiary);text-decoration:none;font-size:.7rem;font-weight:700;
    letter-spacing:0;text-transform:none}
  .back:hover{color:var(--console-text)}
  .path{color:var(--console-tertiary);font:.72rem ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  @media(max-width:575px){.document-toolbar .path{flex-basis:100%;order:1}.document-toolbar .back{margin-right:auto}}
  #chat[hidden]{display:none}
  article{line-height:1.75}
  article h1,article h2,article h3,article h4{font-weight:600;color:var(--console-text);line-height:1.3;
    margin:1.5rem 0 .55rem}
  article h1{font-size:1.65rem;margin-top:0;padding-bottom:.55rem;border-bottom:1px solid var(--console-line)}
  article h2{font-size:1.3rem;padding-bottom:.35rem;border-bottom:1px solid var(--console-line)}
  article h3{font-size:1.08rem}
  article p{margin:.75rem 0}
  article ul,article ol{padding-left:1.4rem}
  article li{margin:.25rem 0}
  article code{background:var(--console-raised);border:1px solid var(--console-line);padding:.08rem .3rem}
  article pre{background:var(--console-raised);border:1px solid var(--console-line);padding:.8rem;overflow:auto}
  article pre code{border:0;padding:0}
  article blockquote{margin:.8rem 0;padding-left:.85rem;border-left:3px solid var(--console-line);color:var(--console-tertiary)}
  article table{border-collapse:collapse;width:100%;margin:.8rem 0;font-size:.9rem}
  article th,article td{border:1px solid var(--console-line);padding:.4rem .55rem;text-align:left;vertical-align:top}
  article th{background:var(--console-raised);color:var(--console-text)}
  .properties{display:grid;grid-template-columns:max-content 1fr;gap:.2rem 1.1rem;margin:0 0 1.25rem;
    padding:0 0 .9rem;border-bottom:1px solid var(--console-line);font-size:.8rem;line-height:1.45}
  .properties dt{color:var(--console-tertiary);font-size:.68rem;font-weight:700;letter-spacing:0;
    text-transform:none;padding-top:.1rem}
  .properties dd{margin:0;color:var(--console-secondary);overflow-wrap:anywhere}
  .state{padding:3rem;text-align:center;color:var(--console-tertiary)}
</style></head>
<body>
<header class="workspace-header navbar" aria-label="Workspace"></header>
<main class="document-shell">
<div class="page-header dashboard-page-header"><div><div class="page-pretitle">Knowledge</div><h1 class="page-title">Vault document</h1></div></div>
  <div class="document-toolbar">
    <a class="back" href="/assistant">← Back to Assistant</a>
    <span class="path" id="path"></span>
    <button type="button" class="btn btn-sm btn-icon btn-ghost-secondary" data-edit hidden aria-label="Edit document" title="Edit document"><svg class="icon" aria-hidden="true"><use href="/static/ui-icons.svg#edit"/></svg></button>
    <button type="button" class="btn btn-sm btn-icon btn-ghost-secondary" id="copy" data-copy-document hidden aria-label="Copy document as Markdown" title="Copy document as Markdown"><svg class="icon" aria-hidden="true"><use href="/static/ui-icons.svg#copy"/></svg></button>
    <a class="btn btn-sm btn-primary" id="chat" hidden><svg class="icon" aria-hidden="true"><use href="/static/ui-icons.svg#assistant"/></svg>Chat about this</a>
  </div>
  <div id="editor"></div>
  <article class="card card-body prose" id="document"><div class="state">Loading document…</div></article>
</main>
<script>
function safeReturnUrl(raw){
  const allowed=new Set(['/runner','/assistant','/pulse','/constellation','/document','/workspace']);
  if(!raw) return null;
  try{
    const url=new URL(raw,location.origin);
    if(url.origin!==location.origin||!allowed.has(url.pathname)) return null;
    return url.pathname+url.search+url.hash;
  }catch(error){ return null; }
}
function backLabel(pathname){
  if(pathname==='/workspace') return '← Back to Workspace';
  if(pathname==='/constellation') return '← Back to Constellation';
  if(pathname==='/pulse') return '← Back to Pulse';
  if(pathname==='/assistant') return '← Back to Assistant';
  if(pathname==='/runner') return '← Back to Workers';
  return '← Back';
}
function resolveReturnUrl(from,item){
  let returnTo=from||(item?'/assistant?item='+encodeURIComponent(item):'/assistant');
  if(!item) return returnTo;
  try{
    const url=new URL(returnTo,location.origin);
    if(url.pathname==='/assistant'&&!url.searchParams.get('item')){
      url.searchParams.set('item',item);
      returnTo=url.pathname+url.search+url.hash;
    }
  }catch(error){}
  return returnTo;
}
function renderProperties(article,properties){
  if(!Array.isArray(properties)||!properties.length) return;
  const list=document.createElement('dl');
  list.className='properties';
  properties.forEach(([key,value])=>{
    const term=document.createElement('dt');
    term.textContent=String(key).replace(/_/g,' ');
    const detail=document.createElement('dd');
    String(value).split(', ').forEach((part,index)=>{
      if(index) detail.append(', ');
      if(/^https?:\/\//.test(part)){
        const link=document.createElement('a');
        link.href=part;link.target='_blank';link.rel='noopener';
        try{ link.textContent=new URL(part).hostname; }catch(error){ link.textContent=part; }
        detail.append(link);
      }else detail.append(part);
    });
    list.append(term,detail);
  });
  article.prepend(list);
}
const editor=documentEditor(document.getElementById('editor'),document.getElementById('document'),safeMarkdown,loadDocument);
let loadToken=0;
async function loadDocument(){
  if(editor.active()) return;
  const token=++loadToken;
  const params=new URLSearchParams(location.search);
  const path=params.get('path')||'';
  const item=params.get('item');
  const from=safeReturnUrl(params.get('from'));
  const back=document.querySelector('.back');
  if(back){
    const returnTo=resolveReturnUrl(from,item);
    back.href=returnTo;
    back.textContent=backLabel(new URL(returnTo,location.origin).pathname);
  }
  const article=document.getElementById('document');
  try{
    const visible=from && ['/workspace','/pulse','/constellation'].includes(new URL(from,location.origin).pathname);
    const response=await fetch('/api/vault-document?path='+encodeURIComponent(path)+(visible?'&visible=true':''));
    const data=await response.json();
    if(token!==loadToken || editor.active()) return;
    if(!response.ok) throw new Error(data.error||'Document could not be loaded');
    editor.setPath(path,data.title);
    const version=JSON.stringify([data.content,data.properties]);
    if(version===shownVersion) return;
    const firstLoad=shownVersion===null;
    shownVersion=version;
    shownMarkdown=data.content;
    document.getElementById('copy').hidden=false;
    const top=window.scrollY;
    document.title=data.title+' · Roosta';
    document.getElementById('path').textContent=data.path;
    const chat=document.getElementById('chat');
    chat.href='/assistant?item='+encodeURIComponent('doc:'+data.path);
    chat.hidden=!/\.md$/i.test(data.path);
    article.innerHTML=safeMarkdown(wikiLinks(data.content,await vaultPaths(data.content),data.path));
    keepLinksInPage(article,params);
    renderProperties(article,data.properties);
    const heading=firstLoad && linkedHeading(article,location.hash);
    if(heading) heading.scrollIntoView();
    else window.scrollTo(0,top);
  }catch(error){
    if(token!==loadToken || editor.active()) return;
    editor.setPath('');shownVersion=null;
    article.innerHTML='';
    const state=document.createElement('div');
    state.className='state';
    state.textContent=error.message||'Document could not be loaded';
    article.appendChild(state);
  }
}
function linkedHeading(article,hash){
  if(!hash) return;
  return [...article.querySelectorAll('h1,h2,h3,h4,h5,h6')].find(heading=>{
    const slug=heading.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu,'').replace(/\s+/g,'-');
    return '#'+encodeURIComponent(slug)===hash;
  });
}
// The vault file list is only needed (and fetched once) when a document holds vault links.
let pathsPromise=null;
function vaultPaths(content){
  if(!/\[\[|\.md[)>#]/i.test(content)) return [];
  pathsPromise=pathsPromise||fetch('/api/workspace').then(r=>r.json()).then(d=>d.files.map(f=>f.path)).catch(()=>{pathsPromise=null;return [];});
  return pathsPromise;
}
// Vault links open in this tab and keep the original Back destination.
function keepLinksInPage(article,params){
  article.querySelectorAll('a[href]').forEach(link=>{
    const url=new URL(link.href);
    if(url.origin!==location.origin||url.pathname!=='/document') return;
    ['from','item'].forEach(key=>{ if(params.get(key)) url.searchParams.set(key,params.get(key)); });
    link.href=url.pathname+url.search;
    link.removeAttribute('target');link.removeAttribute('rel');
  });
}
let shownVersion=null,shownMarkdown='';
markdownCopy.watch('#document');
document.getElementById('copy').addEventListener('click',()=>markdownCopy.copyMarkdown(shownMarkdown.trim()+'\n','Document copied as Markdown'));
loadDocument();
// The Assistant (or Obsidian) may have edited the file while this tab was in
// the background, so re-read it on return rather than showing a stale copy.
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) loadDocument(); });
</script></body></html>

<style>
  :root{

  .rail-item.pinned{border-left-color:var(--warning)}
  .rail-item .t{font-size:.875rem;font-weight:550;line-height:1.4;color:var(--text);margin-bottom:.3rem}

  .general-mark{grid-row:1/3;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;
    background:color-mix(in srgb,var(--signal-violet) 10%,transparent);color:var(--signal-violet);font-size:.9rem}
  .thread-close,.pin-item{position:absolute;top:.8rem;right:.4rem}
  .thread-close,.pin-item,#docpane-hide{width:24px;height:24px;min-width:0;padding:0;display:inline-grid;place-items:center}
  .pin-item.on{color:var(--warning)}
  .thread-close .icon,.pin-item .icon,#docpane-hide .icon{width:14px;height:14px;margin:0}
  .general-mark .icon{width:16px;height:16px}
  .rail-item .ctas{margin-top:.6rem}
  .doc-thread .w{display:flex;align-items:center;gap:.5rem;min-width:0}
  .doc-thread-path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.65rem;color:var(--tertiary)}
  .rail-toolbar{align-items:flex-start;border-top:1px solid var(--tblr-border-color-translucent);margin-top:.8rem}

  .order-control{display:flex;align-items:center;gap:.35rem;font-size:.65rem;color:var(--tertiary)}
  .order-control>span{display:none}
  .order-control .form-select{width:135px;padding:.35rem 1.7rem .35rem .5rem;font-size:.65rem}
  .rail-meta{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem;padding-right:1.25rem}
  .queue-index{margin-left:auto;font-size:.625rem;color:var(--tertiary);font-variant-numeric:tabular-nums}

  .item-email,.action-email{--item-colour:#efc078;--tag-colour:#efc078}
  .item-standup,.action-standup{--item-colour:#79d4b0;--tag-colour:#79d4b0}
  .item-meeting,.action-meeting{--item-colour:#c6a3eb;--tag-colour:#c6a3eb}
  .item-document,.action-document{--item-colour:#dacf84;--tag-colour:#dacf84}
  .item-review,.action-review{--item-colour:#8ecdd8;--tag-colour:#8ecdd8}
  .item-decision,.action-decision{--item-colour:#eba3cc;--tag-colour:#eba3cc}
  .item-task,.action-task{--item-colour:#ff8c93;--tag-colour:#ff8c93}
  [data-bs-theme="light"] :is(.item-chat,.action-chat,.item-teams,.action-teams){--item-colour:#6a4fc9;--tag-colour:#6a4fc9}
  [data-bs-theme="light"] :is(.item-ticket,.action-ticket,.item-jira,.action-jira){--item-colour:#2f6fd0;--tag-colour:#2f6fd0}
  [data-bs-theme="light"] :is(.item-email,.action-email){--item-colour:#9a6410;--tag-colour:#9a6410}
  [data-bs-theme="light"] :is(.item-standup,.action-standup){--item-colour:#16805b;--tag-colour:#16805b}
  [data-bs-theme="light"] :is(.item-meeting,.action-meeting){--item-colour:#8a4fb8;--tag-colour:#8a4fb8}
  [data-bs-theme="light"] :is(.item-document,.action-document){--item-colour:#7d6d12;--tag-colour:#7d6d12}
  [data-bs-theme="light"] :is(.item-review,.action-review){--item-colour:#1d7a8b;--tag-colour:#1d7a8b}
  [data-bs-theme="light"] :is(.item-decision,.action-decision){--item-colour:#b13f7c;--tag-colour:#b13f7c}
  [data-bs-theme="light"] :is(.item-task,.action-task){--item-colour:#c2414d;--tag-colour:#c2414d}

  .rail-closed-head{cursor:pointer;user-select:none}.rail-closed-head:hover{color:var(--text)}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel)}
  .conversation-header{min-height:80px;padding:1.2rem 1.75rem;flex:none;justify-content:space-between;gap:1rem;flex-wrap:wrap}
  .conversation-heading{flex:1;min-width:0}

  .conversation-header .card-title{overflow-wrap:anywhere;font-size:.9375rem;line-height:1.4;margin:0;font-weight:550}

  .msg .bubble{min-width:0;overflow-wrap:anywhere;font-size:.9375rem;line-height:1.5;color:var(--text)}

  .recommendation-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem}
  .recommendation-head .brief-label{margin:0;color:var(--signal-violet)}

  .ctas{display:flex;flex-wrap:wrap;gap:.5rem .8rem;margin-top:.8rem}

  .md>*:first-child,.bubble>*:first-child{margin-top:0}.md>*:last-child,.bubble>*:last-child{margin-bottom:0}

  .md code,.bubble code{background:var(--console-tint);border:1px solid var(--console-tint);border-radius:4px;padding:.05rem .3rem;font-size:.85em;color:var(--console-code)}

  .input:focus{background:transparent;box-shadow:none;outline:none}
  .form:focus-within{border-color:color-mix(in srgb,var(--signal-violet) 50%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--signal-violet) 8%,transparent)}

  .chat-attachments{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
  .chat-attachment-image img{display:block;max-width:min(320px,100%);max-height:240px;border:1px solid var(--line);border-radius:6px}

  .idea-kind{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--signal-violet)}

  .empty h2{font-size:1.15rem;font-weight:500;color:var(--secondary)}.empty p{font-size:.8rem}

  }

<body class="assistant-page">
<header class="workspace-header navbar" aria-label="Workspace"></header>
<div class="page-header dashboard-page-header">
  <div><div class="page-pretitle">Your workspace</div><h1 class="page-title">Assistant</h1></div>
  <div class="board-status text-secondary" id="status" role="status"></div>
</div>
<div class="main">
  <aside class="attention-queue" aria-label="Attention inbox" id="attention-queue">
    <div class="queue-header">

<script>
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const allowedMarkdownTags=new Set([
  'A','BLOCKQUOTE','BR','CODE','DEL','EM','H1','H2','H3','H4','H5','H6','HR',
  'LI','OL','P','PRE','STRONG','TABLE','TBODY','TD','TH','THEAD','TR','UL'
]);
function vaultMarkdownPath(text){
  const path=String(text||'').trim();
  if(!path||path.startsWith('/')||path.toLowerCase().startsWith('dashboard/')||path.includes('\\')) return '';
  if(!/\.md$/i.test(path)||/^[a-z][a-z0-9+.-]*:/i.test(path)) return '';
  const parts=path.split('/');
  return parts.some(part=>!part||part==='.'||part==='..')?'':path;
}
function md(source,copyBlocks=true){
  try{
    const template=document.createElement('template');
    template.innerHTML=marked.parse(String(source||''));
    [...template.content.querySelectorAll('*')].forEach(element=>{
      if(!allowedMarkdownTags.has(element.tagName)){
        element.replaceWith(document.createTextNode(element.textContent||''));
        return;
      }
      const href=element.tagName==='A'?element.getAttribute('href'):null;
      [...element.attributes].forEach(attribute=>element.removeAttribute(attribute.name));
      if(element.tagName==='A'&&href){
        try{
          if(!/^[a-z][a-z0-9+.-]*:/i.test(href)&&/\.(md|html|txt|json|ya?ml|csv)$/i.test(href)){
            element.href=documentHref(href.replace(/^\//,''));
            element.target='_blank'; element.rel='noopener';
            return;
          }
          const url=new URL(href,location.origin);
          if(!['http:','https:'].includes(url.protocol)) throw new Error('unsafe link');
          element.href=url.toString(); element.target='_blank'; element.rel='noopener';
        }catch(error){ element.removeAttribute('href'); }
      }
    });
    [...template.content.querySelectorAll('code')].forEach(element=>{
      if(element.closest('pre,a')) return;
      const path=vaultMarkdownPath(element.textContent);
      if(!path) return;
      const link=document.createElement('a');
      link.href=documentHref(path); link.target='_blank'; link.rel='noopener';
      link.textContent=element.textContent;
      element.replaceWith(link);
    });
    if(copyBlocks) template.content.querySelectorAll('pre').forEach(pre=>{
      if(!pre.querySelector(':scope > code')) return;
      const block=document.createElement('div');
      block.className='code-block';
      block.innerHTML='<button type="button" class="btn btn-icon btn-sm btn-ghost-secondary copy-code" aria-label="Copy code" title="Copy code">'
        +'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">'
        +'<rect x="8" y="8" width="12" height="13" rx="2"/>'
        +'<path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button>';
      pre.replaceWith(block);
      block.prepend(pre);
    });
    return template.innerHTML;
  }catch(error){ return esc(source).replace(/\n/g,'<br>'); }
}
const escAttr=s=>esc(s).replace(/"/g,'&quot;');

function healthWarning(h){

  const restart=h.restart_pending

function freshness(iso){

  return ` · ${when}`;
}

function importanceScore(item){
  const text=[item.title,item.why,item.situation,item.opening_move].join(' ').toLowerCase();
  let score=1;
  if(item.action_owner==='user') score+=1;
  if(item.new) score+=1;
  if(/\b(incident|outage|security|escalation|overdue|production down|p[01])\b/.test(text)) score+=2;
  else if(/\b(today|tomorrow|deadline|blocked|waiting|approval|risk|urgent)\b/.test(text)) score+=1;
  if(item.action_type==='decision') score+=1;
  return Math.min(5,score);
}

    const pin=(pinnedIds.has(b.item.id)?1:0)-(pinnedIds.has(a.item.id)?1:0);
    if(pin) return pin;

      const date=(Date.parse(b.item.raised_at)||0)-(Date.parse(a.item.raised_at)||0);

async function uploadOne(id,file,name,state){

    list.push({id:out.id,name:out.name,size:out.size,image:out.image===true});
    setPendingUploads(id,list);

async function uploadFiles(id,fileList){

      state.errors.push(`Attach up to ${MAX_UPLOADS} files per message.`); break; }
    if(file.size>MAX_UPLOAD){ state.errors.push(`${name} exceeds the 20 MB upload limit.`); continue; }
    accepted.push({file,name});

function autosizeComposer(input){
  if(!input) return;
  const style=getComputedStyle(input);
  const min=parseInt(style.minHeight,10)||38;
  const max=parseInt(style.maxHeight,10)||180;
  input.style.height='0px';
  const next=Math.max(input.scrollHeight,min);
  input.style.height=Math.min(next,max)+'px';

function pastedLinkText(html,plain){
  // Rich copies from Teams or Outlook can carry a link only in text/html; keep the URL.
  const decode=s=>String(s||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
    .replace(/&#39;/g,"'").replace(/&amp;/g,'&');
  let text=String(plain||''), changed=false;
  const anchor=/<a\b[^>]*?\bhref\s*=\s*("([^"]*)"|'([^']*)')[^>]*>([\s\S]*?)<\/a>/gi;
  for(const m of String(html||'').matchAll(anchor)){
    const href=decode(m[2]??m[3]).trim();
    if(!/^https?:\/\//i.test(href)||text.includes(href)) continue;
    const label=decode(m[4]).replace(/\s+/g,' ').trim();
    const at=label?text.indexOf(label):-1;
    text=at>=0
      ?text.slice(0,at)+`[${label}](${href})`+text.slice(at+label.length)
      :(text?text.replace(/\s*$/,' ')+href:href);
    changed=true;
  }
  return changed?text:null;
}
function bindComposerInput(input){
  if(!input||input.dataset.autosize==='1') return;
  input.dataset.autosize='1';
  const grow=()=>autosizeComposer(input);
  input.addEventListener('input',grow);
  input.addEventListener('keydown',grow);
  input.addEventListener('paste',e=>{
    const data=e.clipboardData;
    const text=data&&pastedLinkText(data.getData('text/html'),data.getData('text/plain'));
    if(!text) return;
    e.preventDefault();
    input.setRangeText(text,input.selectionStart,input.selectionEnd,'end');
    grow();
  });

}

async function openContextDialog(id,mode){

function syncConversation(id){

  if(boundary&&boundary!==c.boundary){
    const brief=c.log.querySelector('.item-brief')?.closest('.msg');
    c.log.replaceChildren(...(brief?[brief]:[]));
    delete c.log.dataset.day;

  if(later.some(it=>it.id===requestedItem)){ requestedItemOpened=true; unsnoozeItem(requestedItem); return; }

// A turn targets a specific item id, so it streams into THAT item's log even if

function send(id,message){
  const c=convo(id);
  const uploads=pendingUploads(id), sent=Boolean(message||uploads.length);
  if(uploads.length){ setPendingUploads(id,[]); renderUploads(id); }
  const payload=JSON.stringify({item_id:id,message,context_paths:contextFor(id),
    ...(uploads.length?{uploads:uploads.map(u=>u.id)}:{})});
  const files=attachmentsHtml(id,uploads), label=message||(uploads[0]&&uploads[0].name)||'';
  if(sent) c.log.querySelectorAll('.examples').forEach(el=>el.remove());  // ideas only help an empty chat
  if(isChatId(id)&&sent&&!chats.some(r=>r.id===id)){
    // Name and list a new chat at once rather than on the next poll.
    if(!c.firstMessage) c.firstMessage=label;
    chats.unshift({id,at:new Date().toISOString(),preview:label,turns:1});
    renderRail();
    const heading=document.querySelector('.conversation-heading .card-title');
    if(activeId===id&&heading) heading.textContent=chatItem(id)?.title||chatTitle(id);
  }
  trackUsage('chat_sent',{
    scope:isGeneralChatId(id)?'general':isDocId(id)?'document':isWorkerId(id)?'worker':isHireId(id)?'hire':'item',
    mode:sent?'message':'recommendation'
  });
  const queued=c.busy||activeChats.has(id), sequence=++sendSequence;
  let note, ai;
  if(sent){
    c.log.insertAdjacentHTML('beforeend',
      `<div class="msg you${queued?' queued':''}" ${queued?'data-queued="1"':''}><div class="who">You${stamp(c.log,new Date())}</div><div class="bubble">${esc(message)}${files}${queued?'<div class="queued-note">Queued…</div>':''}</div></div>`);
    note=c.log.lastElementChild.querySelector('.queued-note');
    scrollLog(c);
  }
  function startReply(){
    if(c.stream){
      c.stream.querySelector('.reply-progress')?.remove();
      if(!c.stream.querySelector('.bubble').hasChildNodes()) c.stream.remove();
    }
    c.log.querySelector('.server-progress')?.remove();
    ai=document.createElement('div'); ai.className='msg ai';
    ai.innerHTML='<div class="who">Assistant'+stamp(c.log,new Date())+'</div><div><div class="reply-progress" role="status">Sending…</div><div class="bubble"></div></div>';
    ai._raw='';
    c.stream=ai; c.sequence=sequence;
    c.log.appendChild(ai); scrollLog(c); c.busy=true; activeChats.add(id); renderRail();
  }
  if(!queued) startReply();
  fetch('/api/board/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:payload})
    .then(async res=>{
      if(res.status===202){
        const out=await res.json();
        c.queuedCount=Math.max(c.queuedCount,out.position||1);
        if(sent) c.historyCount+=1;
        clearQueuedNotes(c);
        ai?.remove();
        if(ai&&c.stream===ai){ c.stream=null; c.busy=false; }
        load(); return;
      }
      if(!res.ok){
        const detail=await res.json().catch(()=>({}));

      }
      if(sequence<c.sequence){ res.body.cancel(); return; }
      note?.remove();
      if(!ai) startReply();
      if(sent) c.historyCount+=1;
      return streamBody(id,res,ai);
    }).catch(error=>{
      if(note) note.textContent=error.message;
      if(ai&&c.stream===ai){
        ai.querySelector('.reply-progress')?.remove();
        ai.querySelector('.bubble').textContent=error.message;
        c.busy=false; c.stream=null; load(); renderRail();
      }
    });

function clearQueuedNotes(c){

async function streamBody(id,res,ai){
  const c=convo(id);
  try{
    const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';

      buf+=dec.decode(value,{stream:true}); let i;

        if(!chunk.startsWith('data: ')) continue; handle(id,JSON.parse(chunk.slice(6)),ai); } }
  }catch(e){
    if(c.stream===ai&&!ai._terminal) ai.querySelector('.bubble').insertAdjacentHTML('beforeend',
      '<div class="err-line">Connection lost. The reply will continue in the background.</div>');
  }
  finally{
    ai.querySelector('.reply-progress')?.remove();
    if(c.stream!==ai) return;
    c.stream=null; c.busy=false;
    appliedBoardRequest=++boardRequest;
    if(ai._closed) activeChats.delete(id);

  if(ai._terminal&&ev.kind!=='_close') return;
  ai.querySelector('.reply-progress')?.remove();
  if(ev.kind!=='text') ai._terminal=true;
  if(ev.kind==='text'){ ai._got=true; ai._raw+=ev.text; b.innerHTML=md(visibleReply(ai._raw)); }
  else if(ev.kind==='pause'){ renderApproval(id,ai,ev.run_id,ev.payload||{}); }
  else if(ev.kind==='defer'){
    const p=ev.payload||{}, it=items.find(x=>x.id===id);
    items=items.filter(x=>x.id!==id);
    later=later.filter(x=>x.id!==id);
    if(it) later.push({...it,snoozed_until:p.until});
    later.sort((a,b)=>String(a.snoozed_until).localeCompare(String(b.snoozed_until)));
    b.insertAdjacentHTML('beforeend',
      `<div class="defer-line">Revisit ${esc(laterLabel(p.until))}${p.reason?' - '+esc(p.reason):''}</div>`);
    if(activeId===id){ activeId=null; syncItemUrl(null); }
    renderRail();
  }
  else if(ev.kind==='done'){
    if(!ai._got){ b.innerHTML=md((ev.payload||{}).result||'Done'); }
    showLearned(ai,(ev.payload||{}).learned,id);
    // Chats, documents, people and workers are standing threads: the server never
    // marks them handled, so neither announce a close nor drop them from the rail.
    if((ev.payload||{}).acted && !isChatId(id) && !String(id).startsWith('person:')){
      const label=closedLabel(id,(ev.payload||{}).result);
      showClosedNotice(label);
      // The actor actually changed something - resolve and drop from the rail.
      b.insertAdjacentHTML('beforeend',`<div class="alert alert-success mt-3 mb-0" role="status" aria-live="polite">
        <div class="d-flex align-items-start gap-3"><div class="flex-fill">
          <div class="alert-title">Action closed</div>
          <div>${esc(label||'One less thing on your list.')}</div></div>
          <button class="btn btn-sm resolution-undo">Undo</button>
        </div></div>`);
      const undoBtn=b.querySelector('.resolution-undo');
      if(undoBtn) undoBtn.onclick=()=>{ undoBtn.disabled=true; undoBtn.textContent='Reopening…'; reopenItem(id); };
      items=items.filter(x=>x.id!==id); renderRail();
    }
    // else: it just answered - keep the item, conversation continues.
  }
  else if(ev.kind==='error'){ if(!ai._got) b.innerHTML=''; b.insertAdjacentHTML('beforeend',`<div class="err-line">${esc((ev.payload||{}).reason||'Failed')}</div>`); }
  else if(ev.kind==='reply_end'||ev.kind==='_close'){
    if(ev.payload&&ev.payload.learned) showLearned(ai,ev.payload.learned,id);
    if(!ai._got&&!b.hasChildNodes()) b.innerHTML='<span class="err-line">No reply.</span>';
    if(ev.kind==='_close'){
      ai._closed=true;
      const visible=visibleReply(ai._raw).trim();
      if(visible) c.historyCount+=1;
    }
  }
  scrollLog(c);
}
// A message is the user's own text, editable up to send. Anything else is an
// action: the chat names the button ("Create", "Reply", "Move to Done") and
// shows a readable preview, with the exact instruction tucked behind a
// details toggle so the card isn't a wall of JSON.
function approvalVerbs(kind,verb){
  if(verb) return [verb,'Working…','Done ✓',verb+' failed'];
  return kind==='message' ? ['Send','Sending…','Sent ✓','Send failed']
                           : ['Approve','Working…','Done ✓','Failed'];
}
function renderApproval(id,ai,runId,p){
  const isMessage=p.kind==='message';
  const [verb]=approvalVerbs(p.kind,p.verb);
  const div=document.createElement('div'); div.className='approval'; div.dataset.run=runId||'';
  let body;
  if(isMessage){
    body=`<textarea class="form-control approval-draft" aria-label="Draft to approve">${esc(p.draft||'')}</textarea>`;
  }else{
    body=`<div class="card card-body approval-preview">${md(p.preview||p.draft||'')}</div>`;
    if(p.instruction){
      body+=`<details class="approval-raw"><summary>Show details</summary>
        <pre>${esc(p.instruction)}</pre></details>`;
    }
  }
  div.innerHTML=`<div class="approval-summary">${esc(p.summary||'Approve this?')}</div>
    ${body}
    <div class="approval-buttons"><button class="btn btn-danger aps">${verb}</button>
      <button class="btn apc">Cancel</button></div>`;
  (ai.querySelector('.bubble')||ai).appendChild(div);
  const edited=()=>isMessage ? div.querySelector('.approval-draft').value : null;
  div.querySelector('.aps').onclick=()=>resolve(id,runId,true,edited(),div,p.kind,p.verb);
  div.querySelector('.apc').onclick=()=>resolve(id,runId,false,null,div,p.kind,p.verb);
}
async function resolve(id,runId,approved,edit,div,kind,verb){
  const [,doing,done,failed]=approvalVerbs(kind,verb);
  div.querySelector('.approval-buttons').textContent=approved?doing:'Cancelling…';
  let out={};
  try{ out=await (await fetch(`/api/board/chat/${runId}/approve`,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({approved,edit})})).json(); }catch(e){}
  const bb=div.querySelector('.approval-buttons');
  if(bb) bb.textContent = out.sent?done:(approved?failed:'Cancelled');
  // The sender's own summary carries the result, e.g. the new ticket key and link.
  if(approved && out.summary){
    const note=document.createElement('div'); note.className='approval-result';
    note.innerHTML=md(out.summary); div.appendChild(note);
  }
  if(out.sent){ showClosedNotice(closedLabel(id,out.summary)); items=items.filter(x=>x.id!==id); renderRail(); }
}
document.getElementById('rail').addEventListener('click',e=>{
  const archive=e.target.closest('[data-archive-chat]');
  if(archive){ archiveChat(archive.dataset.archiveChat); return; }
  const pin=e.target.closest('[data-pin-id]');
  if(pin){ togglePin(pin.dataset.pinId); return; }
  const wake=e.target.closest('[data-wake-id]');
  if(wake){ unsnoozeItem(wake.dataset.wakeId); return; }
  const reopen=e.target.closest('[data-reopen-id]');
  if(reopen){ reopenItem(reopen.dataset.reopenId); return; }
  if(e.target.closest('[data-toggle-closed]')){ closedOpen=!closedOpen; renderRail(); return; }
  if(e.target.closest('.cta, .general-item a')) return;  // let links open without switching panes
  const el=e.target.closest('.rail-item'); if(el) openItem(el.dataset.id);
});

const askBox=document.getElementById('ask-box');
askBox.addEventListener('keydown',e=>{

document.getElementById('rail').addEventListener('change',e=>{
  const order=e.target.closest('[data-order]');

    trackUsage('order_changed',{order:orderMode}); renderRail(); }
});

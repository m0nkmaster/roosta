name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/desktop-build.yml
    with:
      runner: macos-15
      arch: arm64
    secrets: inherit
  build-intel:
    uses: ./.github/workflows/desktop-build.yml
    with:
      runner: macos-15-intel
      arch: x64
    secrets: inherit
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build and test Python distributions
        run: |
          python -m pip install '.[dev]' build twine
          python scripts/release.py check
          python -m pytest -q
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build
          python -m twine check dist/*
          python -m venv /tmp/roosta-wheel
          /tmp/roosta-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/roosta-wheel/bin/roosta --version
          /tmp/roosta-wheel/bin/roosta init --skip-checks --no-git /tmp/roosta-wheel-workspace
      - uses: actions/upload-artifact@v6
        with:
          name: Python
          path: dist/*
          if-no-files-found: error
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, python]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/roosta
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: Python
          path: dist
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Verify published package hashes
        run: python scripts/release.py verify-pypi dist
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, python, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: release-assets
      - name: Verify assets and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish release-assets
  release-intel:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-intel, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Roosta-x64
          path: intel-assets
      - name: Attach Intel assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd intel-assets
          sha256sum -c ./*.sha256
          existing="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for file in *.dmg *.sha256; do
            grep -Fxq "$file" <<<"$existing" || gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          done
